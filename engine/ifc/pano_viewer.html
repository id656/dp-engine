<title>Панорамы __CIPHER__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=PT+Mono&family=PT+Sans+Narrow:wght@400;700&display=swap">
<style>
/* Layout: full-bleed 360° sphere under three overlays: brand bar (top), plan of camera stations (top right),
   room card and room strip (bottom). Palette from the project itself: С1 warm white, С2 deep blue, matt brass. */
:root{
  color-scheme:dark;
  --ground:#10141f;
  --panel:rgba(16,21,36,.76);
  --ink:#ece6db;
  --mute:#afb3c2;
  --line:rgba(236,230,219,.18);
  --navy:#283658;
  --brass:#c9a96e;
  --brass-soft:rgba(201,169,110,.26);
  --cone-0:rgba(201,169,110,.78);
  --cone-1:rgba(201,169,110,0);
  --room:rgba(236,230,219,.07);
  --glass:#9fb4d8;
  --scrim:16,20,31;
  --f-disp:"Prata","Times New Roman",Georgia,serif;
  --f-ui:"PT Sans Narrow","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --f-data:"PT Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.35 var(--f-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#poster,#view,#flat{position:fixed;inset:0;width:100%;height:100%}
#poster{background-color:var(--ground);background-repeat:no-repeat;background-position:50% 50%;
  background-size:max(400vw,200vh) auto}
#view{display:block;touch-action:none;cursor:grab;outline:none}
#view.drag{cursor:grabbing}
#flat{overflow-x:auto;overflow-y:hidden;background:var(--ground)}
#flat img{display:block;height:100%;width:auto;max-width:none}

.top{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to bottom,rgba(var(--scrim),.84),rgba(var(--scrim),0));pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:block;height:34px;width:auto;max-width:100%;border-radius:2px}
.doc{margin-left:auto;display:grid;justify-items:end;gap:1px;font:400 12px/1.3 var(--f-data);color:var(--mute);
  font-variant-numeric:tabular-nums;min-width:0}
.doc b{font-weight:400;color:var(--ink);letter-spacing:.02em}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;
  background:var(--panel);cursor:pointer;padding:0}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.6}

.busy{position:fixed;z-index:4;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;overflow:hidden;pointer-events:none}
.busy::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:var(--brass);
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

.plan{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 62px);
  right:max(16px,env(safe-area-inset-right,0px));width:clamp(144px,36vw,260px);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden}
.plan-head{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:baseline;gap:6px;padding:6px 9px;cursor:pointer;
  font:700 11px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.1em;color:var(--ink)}
.plan-head span{font-weight:400;color:var(--mute);letter-spacing:.06em}
.plan-head i{margin-left:auto;font-style:normal;color:var(--brass)}
.plan-head:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
#plan{display:block;width:100%;max-width:100%;height:auto;cursor:pointer;touch-action:manipulation}
.plan.closed #plan{display:none}

.hint{position:fixed;z-index:2;left:50%;top:46%;transform:translate(-50%,-50%);margin:0;max-width:calc(100% - 48px);
  padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  font-size:15px;letter-spacing:.02em;text-align:center;pointer-events:none;transition:opacity .7s}
.hint.off{opacity:0}

.bottom{position:fixed;z-index:3;left:0;right:0;bottom:0;display:grid;gap:12px;
  padding-top:44px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,rgba(var(--scrim),.92) 0%,rgba(var(--scrim),.66) 62%,rgba(var(--scrim),0));
  pointer-events:none}
.bottom>*{pointer-events:auto;min-width:0}
.card{display:grid;gap:5px;max-width:36rem}
.card-head{display:flex;align-items:baseline;gap:10px;min-width:0}
.num{font:400 13px/1 var(--f-data);color:var(--brass);letter-spacing:.04em}
.name{margin:0;font:400 clamp(24px,6.6vw,36px)/1.08 var(--f-disp);text-wrap:balance;min-width:0}
.meta{margin:0;display:flex;flex-wrap:wrap;gap:3px 14px;font:400 12px/1.4 var(--f-data);color:var(--mute);
  font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fin-btn{all:unset;cursor:pointer;font:700 12px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.1em;
  color:var(--brass);padding:6px 0;border-bottom:1px solid var(--brass-soft)}
.fin-btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.err{margin:0;font-size:14px;color:var(--ink);background:rgba(160,60,50,.55);padding:6px 10px;border-radius:4px}
.fin{margin:4px 0 0;display:grid;gap:6px;max-height:34vh;overflow-y:auto;font-size:15px;line-height:1.3;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fin>div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px}
.fin dt{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.09em;padding-top:3px}
.fin dd{margin:0;min-width:0}
.fin dd b{font:400 13px/1 var(--f-data);color:var(--brass);margin-right:7px}
.fin .note{color:var(--mute)}
.fin .small{font-size:12px;color:var(--mute);padding-top:4px}

.strip{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;
  scrollbar-width:none;padding:2px 2px 2px 0}
.strip::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;flex:0 0 auto;width:94px;display:grid;gap:5px;padding:3px;border-radius:6px;
  cursor:pointer;scroll-snap-align:start}
.chip img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;opacity:.7;
  box-shadow:0 0 0 1px var(--line);background:var(--navy);transition:opacity .2s}
.chip span{font-size:13px;line-height:1.15;color:var(--mute)}
.chip b{font:400 12px/1 var(--f-data);color:var(--brass);margin-right:5px}
.chip[aria-pressed="true"] img{opacity:1;box-shadow:0 0 0 2px var(--brass)}
.chip[aria-pressed="true"] span{color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

@media (min-width:760px){
  .bottom{grid-template-columns:minmax(0,1fr) auto;align-items:end}
  .strip{justify-content:flex-end}
  .chip{width:118px}
  .chip span{font-size:14px}
  .logo{height:40px}
}
@media (max-width:420px){
  .plan-head span{display:none}
}
@media (prefers-reduced-motion:reduce){
  .busy::after{animation:none;width:100%;opacity:.6}
  .hint,.chip img{transition:none}
}
</style>

<div id="poster" aria-hidden="true"></div>
<canvas id="view" tabindex="0" aria-label="Панорама помещения. Перетаскивайте, чтобы осмотреться; стрелки на клавиатуре поворачивают вид"></canvas>
<div id="flat" hidden><img alt="Панорама помещения, развёртка 360°"></div>

<header class="top">
  <img class="logo" id="logo" alt="PORTFOLIO" hidden>
  <div class="doc"><b id="cipher"></b><span id="rev"></span></div>
  <button class="icon-btn" id="fs" type="button" aria-label="Во весь экран" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg>
  </button>
</header>
<div class="busy" id="busy" hidden></div>

<aside class="plan" id="planBox" aria-label="План квартиры с точками съёмки">
  <button class="plan-head" id="planBtn" type="button" aria-expanded="true" aria-controls="plan">План <span>точки съёмки</span><i id="planIco">−</i></button>
  <canvas id="plan" aria-label="Нажмите на помещение на плане, чтобы перейти в него"></canvas>
</aside>

<p class="hint" id="hint">Ведите пальцем, чтобы осмотреться</p>

<section class="bottom">
  <div class="card" aria-live="polite">
    <div class="card-head"><span class="num" id="num"></span><h1 class="name" id="name"></h1></div>
    <p class="meta" id="meta"></p>
    <div class="row">
      <button class="fin-btn" id="finBtn" type="button" aria-expanded="false" aria-controls="fin">Отделка</button>
      <p class="err" id="err" hidden>Панорама не загрузилась. Проверьте интернет и выберите помещение ещё раз.</p>
    </div>
    <dl class="fin" id="fin" hidden></dl>
  </div>
  <nav class="strip" id="strip" aria-label="Помещения"></nav>
</section>

<script>
(() => {
  const DATA = /*__DATA__*/null;
  const $ = s => document.querySelector(s);
  const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const mm = q => { try { return matchMedia(q).matches; } catch (e) { return false; } };
  const reduce = mm('(prefers-reduced-motion: reduce)');
  const coarse = mm('(pointer: coarse)');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const DEG = Math.PI / 180, FOV0 = 105 * DEG, FMIN = 38 * DEG, FMAX = 125 * DEG, LAT0 = -4 * DEG;
  const rooms = DATA.rooms;
  const st = { lon: 0, lat: LAT0, fov: FOV0, vlon: 0, vlat: 0, auto: !reduce, dirty: true };
  const C = { ink: tok('--ink'), brass: tok('--brass'), soft: tok('--brass-soft'), room: tok('--room'),
              glass: tok('--glass'), ground: tok('--ground'), c0: tok('--cone-0'), c1: tok('--cone-1') };
  const el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
  let cur = null;

  // ---------- шапка ----------
  $('#cipher').textContent = DATA.cipher;
  $('#rev').textContent = [DATA.rev, DATA.city].filter(Boolean).join(' · ');
  if (DATA.logo) { const lg = $('#logo'); lg.src = DATA.logo; lg.hidden = false; }
  if (!coarse) $('#hint').textContent = 'Тяните мышью, чтобы осмотреться. Колесо меняет масштаб';

  // ---------- WebGL: сфера из equirectangular ----------
  const cv = $('#view');
  let gl = null, loc = {}, tex = null, maxTex = 0;
  try { gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false }); } catch (e) { gl = null; }
  if (gl) {
    const VS = 'attribute vec2 p;varying vec2 q;void main(){q=p;gl_Position=vec4(p,0.,1.);}';
    const FS = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n' +
      'varying vec2 q;uniform sampler2D t;uniform vec2 k;uniform vec3 F,R,U;' +
      'void main(){vec3 d=normalize(F+q.x*k.x*R+q.y*k.y*U);' +
      'float lon=atan(d.y,d.x);float lat=asin(clamp(d.z,-1.,1.));' +
      'gl_FragColor=texture2D(t,vec2(fract(lon*.1591549+.5),.5-lat*.3183099));}';
    const sh = (type, srcT) => { const s = gl.createShader(type); gl.shaderSource(s, srcT); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    try {
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('link');
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const pa = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(pa); gl.vertexAttribPointer(pa, 2, gl.FLOAT, false, 0, 0);
      ['t', 'k', 'F', 'R', 'U'].forEach(n => { loc[n] = gl.getUniformLocation(pr, n); });
      gl.uniform1i(loc.t, 0);
      maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
    } catch (e) { gl = null; }
  }
  function upload(img) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
    if (tex) gl.deleteTexture(tex);
    tex = t; st.dirty = true;
  }
  function K() {
    const w = cv.clientWidth || 1, h = cv.clientHeight || 1, t = Math.tan(st.fov / 2);
    return w >= h ? [t, t * h / w] : [t * w / h, t];
  }
  function draw() {
    if (!gl || !tex) return;
    gl.viewport(0, 0, cv.width, cv.height);
    const cl = Math.cos(st.lat), sl = Math.sin(st.lat), co = Math.cos(st.lon), so = Math.sin(st.lon), k = K();
    gl.uniform2f(loc.k, k[0], k[1]);
    gl.uniform3f(loc.F, cl * co, cl * so, sl);
    gl.uniform3f(loc.R, -so, co, 0);
    gl.uniform3f(loc.U, -sl * co, -sl * so, cl);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  const clampLat = () => { st.lat = Math.max(-85 * DEG, Math.min(85 * DEG, st.lat)); };
  const setFov = f => { st.fov = Math.max(FMIN, Math.min(FMAX, f)); st.dirty = true; };

  // ---------- план точек съёмки ----------
  const pc = $('#plan'), P = DATA.plan, E = P.ext;          // ext: x0, y0, x1, y1 (мм; x — вниз, y — вправо, как на листах)
  const PW = E[3] - E[1], PH = E[2] - E[0];
  pc.style.aspectRatio = (PW / PH).toFixed(3);
  let pmap = null, dpr = 1;
  function sizeAll() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (w && h && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
    const pw = Math.round(pc.clientWidth * dpr), ph = Math.round(pc.clientHeight * dpr);
    if (pw && ph && (pc.width !== pw || pc.height !== ph)) { pc.width = pw; pc.height = ph; }
    st.dirty = true;
  }
  function drawPlan() {
    if (!cur || $('#planBox').classList.contains('closed')) return;
    const W = pc.clientWidth, H = pc.clientHeight;
    if (!W || !H) return;
    const g = pc.getContext('2d');
    g.setTransform(pc.width / W, 0, 0, pc.height / H, 0, 0);
    g.clearRect(0, 0, W, H);
    const pad = 7, s = Math.min((W - 2 * pad) / PW, (H - 2 * pad) / PH);
    const ox = (W - s * PW) / 2, oy = (H - s * PH) / 2;
    const X = (x, y) => [ox + (y - E[1]) * s, oy + (x - E[0]) * s];
    pmap = { s, ox, oy };
    const path = pts => { g.beginPath(); pts.forEach((p, i) => { const q = X(p[0], p[1]); if (i) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); }); g.closePath(); };
    rooms.forEach(r => { path(r.poly); g.fillStyle = r === cur ? C.soft : C.room; g.fill(); });
    g.fillStyle = C.ink;
    P.walls.forEach(w => { const a = X(Math.min(w[0], w[2]), Math.min(w[1], w[3]));
      g.fillRect(a[0], a[1], Math.abs(w[3] - w[1]) * s, Math.abs(w[2] - w[0]) * s); });
    P.polys.forEach(p => { path(p); g.fill(); });
    g.strokeStyle = C.glass; g.lineWidth = 1;
    P.windows.forEach(w => { const a = X(w[0], w[1]), ww = (w[3] - w[1]) * s, hh = (w[2] - w[0]) * s;
      g.fillStyle = C.ground; g.fillRect(a[0], a[1], ww, hh);
      g.beginPath();
      if (ww >= hh) { g.moveTo(a[0], a[1] + hh / 2); g.lineTo(a[0] + ww, a[1] + hh / 2); }
      else { g.moveTo(a[0] + ww / 2, a[1]); g.lineTo(a[0] + ww / 2, a[1] + hh); }
      g.stroke(); });
    // конус обзора: центр кадра панорамы смотрит по yaw (от +x к +y), поворот вправо уменьшает азимут
    const hf = Math.atan(K()[0]), az = cur.cam[2] * DEG - st.lon, c = X(cur.cam[0], cur.cam[1]), Rr = 2600 * s;
    const gr = g.createRadialGradient(c[0], c[1], 0, c[0], c[1], Rr);
    gr.addColorStop(0, C.c0); gr.addColorStop(1, C.c1);
    g.beginPath(); g.moveTo(c[0], c[1]); g.arc(c[0], c[1], Rr, Math.PI / 2 - az - hf, Math.PI / 2 - az + hf); g.closePath();
    g.fillStyle = gr; g.fill();
    rooms.forEach(r => { const q = X(r.cam[0], r.cam[1]), on = r === cur;
      g.beginPath(); g.arc(q[0], q[1], on ? 4 : 3, 0, Math.PI * 2);
      g.fillStyle = on ? C.brass : C.ground; g.fill(); g.lineWidth = 1.5; g.strokeStyle = on ? C.ground : C.brass; g.stroke(); });
  }
  const inPoly = (pts, x, y) => { let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const a = pts[i], b = pts[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; }
    return c; };
  pc.addEventListener('click', e => {
    if (!pmap) return;
    const b = pc.getBoundingClientRect(), u = e.clientX - b.left, v = e.clientY - b.top;
    const my = (u - pmap.ox) / pmap.s + E[1], mx = (v - pmap.oy) / pmap.s + E[0];
    let best = rooms.find(r => inPoly(r.poly, mx, my)) || null;
    if (!best) { let bd = 24; rooms.forEach(r => { const d = Math.hypot((r.cam[1] - my) * pmap.s, (r.cam[0] - mx) * pmap.s); if (d < bd) { bd = d; best = r; } }); }
    if (best && best !== cur) show(best);
  });
  const setPlan = open => { $('#planBox').classList.toggle('closed', !open); $('#planBtn').setAttribute('aria-expanded', String(open));
    $('#planIco').textContent = open ? '−' : '+'; store.set('pano.plan', open ? '1' : '0'); sizeAll(); };
  $('#planBtn').addEventListener('click', () => setPlan($('#planBox').classList.contains('closed')));
  setPlan(store.get('pano.plan') !== '0');

  // ---------- карточка помещения ----------
  function card(r) {
    $('#num').textContent = r.id;
    $('#name').textContent = r.name;
    const parts = [r.area + ' м²', r.ceil && 'потолок ' + r.ceil, 'пол ' + r.level, 'камера h ' + r.eye];
    $('#meta').replaceChildren(...parts.filter(Boolean).map(t => el('span', t)));
    const fin = $('#fin'); fin.replaceChildren();
    const row = (dt, code, txt, cls) => { const d = el('div'); d.append(el('dt', dt)); const dd = el('dd', null, cls);
      if (code) dd.append(el('b', code)); dd.append(document.createTextNode(txt)); d.append(dd); fin.append(d); };
    if (r.floor) row('Пол', r.floor[0], r.floor[1]);
    if (r.wall) row('Стены', r.wall[0], r.wall[1]);
    if (r.note) row(r.wall ? '' : 'Стены', '', r.note, 'note');
    r.legend.forEach(l => row('', l[0], l[1]));
    if (r.ceiling) row('Потолок', r.ceiling[0], r.ceiling[1] + (r.ceil ? ', отм. ' + r.ceil : ''));
    row('', '', 'Цвета на экране условны. Материалы и коды — по ведомости отделки альбома ' + DATA.cipher + '.', 'small');
  }
  $('#finBtn').addEventListener('click', () => { const f = $('#fin'), open = f.hidden; f.hidden = !open;
    $('#finBtn').setAttribute('aria-expanded', String(open)); });

  // ---------- лента помещений ----------
  const strip = $('#strip');
  rooms.forEach(r => {
    const b = el('button', null, 'chip'); b.type = 'button'; b.dataset.id = r.id; b.setAttribute('aria-pressed', 'false');
    const im = el('img'); im.src = r.thumb; im.alt = ''; im.width = 240; im.height = 180; im.decoding = 'async';
    const sp = el('span'); sp.append(el('b', r.id), document.createTextNode(r.name));
    b.append(im, sp); b.addEventListener('click', () => { if (r !== cur) show(r); }); strip.append(b);
  });

  // ---------- загрузка панорам ----------
  const load = s => new Promise((ok, no) => { const i = new Image(); i.decoding = 'async';
    i.onload = () => ok(i); i.onerror = () => no(new Error(s)); i.src = s; });
  let seq = 0, prefetched = false;
  function flat(s) { const f = $('#flat'), im = f.querySelector('img'); cv.hidden = true; f.hidden = false;
    im.onload = () => { f.scrollLeft = (im.scrollWidth - f.clientWidth) / 2; }; im.src = s; }
  async function show(r) {
    const my = ++seq; cur = r;
    card(r);
    strip.querySelectorAll('.chip').forEach(b => {
      const on = b.dataset.id === r.id; b.setAttribute('aria-pressed', String(on));
      if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); });
    Object.assign(st, { lon: 0, lat: LAT0, fov: FOV0, vlon: 0, vlat: 0, dirty: true });
    $('#poster').style.backgroundImage = 'url("' + r.low + '")';
    $('#err').hidden = true; $('#busy').hidden = false;
    try { history.replaceState(null, '', '#r' + r.id); } catch (e) {}
    try {
      if (!gl) { flat(r.mid); }
      else {
        upload(await load(r.low));
        if (my !== seq) return;
        const hi = await load(maxTex >= 3072 ? r.img : r.mid);
        if (my !== seq) return;
        upload(hi);
      }
    } catch (e) { if (my === seq) $('#err').hidden = false; }
    if (my !== seq) return;
    $('#busy').hidden = true;
    if (!prefetched) { prefetched = true; rooms.forEach(q => { if (q !== r) { const i = new Image(); i.src = q.low; } }); }
  }

  // ---------- управление ----------
  const pts = new Map(); let pinch = null, dragging = false, vel = { lon: 0, lat: 0, t: 0 };
  const hint = $('#hint');
  const touched = () => { st.auto = false; hint.classList.add('off'); };
  cv.addEventListener('pointerdown', e => {
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    touched(); dragging = true; cv.classList.add('drag');
    st.vlon = st.vlat = 0; vel = { lon: 0, lat: 0, t: performance.now() };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, fov: st.fov }; }
  });
  cv.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      const k = K(), a = -dx * 2 * k[0] / (cv.clientWidth || 1), b = dy * 2 * k[1] / (cv.clientHeight || 1);
      st.lon += a; st.lat += b; clampLat(); st.dirty = true;
      const now = performance.now(), dt = Math.max(8, now - vel.t);
      vel = { lon: 0.75 * a / dt + 0.25 * vel.lon, lat: 0.75 * b / dt + 0.25 * vel.lat, t: now };
    } else if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 8) setFov(pinch.fov * pinch.d / d);
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) { dragging = false; cv.classList.remove('drag');
      if (!reduce && performance.now() - vel.t < 90) { st.vlon = vel.lon; st.vlat = vel.lat; } }
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, up));
  cv.addEventListener('wheel', e => { e.preventDefault(); touched(); setFov(st.fov * Math.exp(e.deltaY * 0.0012)); }, { passive: false });
  cv.addEventListener('dblclick', () => { touched(); setFov(st.fov > FOV0 * 0.75 ? st.fov / 1.6 : FOV0); });
  addEventListener('keydown', e => {
    const a = document.activeElement;
    if (a && a !== document.body && a !== cv) return;
    const s = 6 * DEG; let used = true;
    if (e.key === 'ArrowLeft') st.lon -= s; else if (e.key === 'ArrowRight') st.lon += s;
    else if (e.key === 'ArrowUp') st.lat += s; else if (e.key === 'ArrowDown') st.lat -= s;
    else if (e.key === '+' || e.key === '=') setFov(st.fov / 1.12); else if (e.key === '-' || e.key === '_') setFov(st.fov * 1.12);
    else used = false;
    if (used) { e.preventDefault(); touched(); clampLat(); st.dirty = true; }
  });
  const fsb = $('#fs');
  if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
    fsb.hidden = false;
    fsb.addEventListener('click', () => {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => { fsb.hidden = true; });
    });
  }

  // ---------- кадр ----------
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(64, Math.max(0, now - last)); last = now;
    if (st.auto && tex) { st.lon += 0.00005 * dt; st.dirty = true; }
    if (!dragging && (Math.abs(st.vlon) > 1e-6 || Math.abs(st.vlat) > 1e-6)) {
      st.lon += st.vlon * dt; st.lat += st.vlat * dt; clampLat();
      const f = Math.pow(0.92, dt / 16.7); st.vlon *= f; st.vlat *= f;
      if (Math.abs(st.vlon) < 1e-6 && Math.abs(st.vlat) < 1e-6) st.vlon = st.vlat = 0;
      st.dirty = true;
    }
    if (st.dirty) { st.dirty = false; draw(); drawPlan(); }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', sizeAll);
  addEventListener('orientationchange', sizeAll);
  sizeAll();
  const h = (location.hash || '').replace('#r', '');
  show(rooms.find(r => r.id === h) || rooms.find(r => r.id === DATA.start) || rooms[0]);
  requestAnimationFrame(tick);
})();
</script>
