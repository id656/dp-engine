<!doctype html>
<html><head><meta charset="utf-8"><title>Preview</title>
<style>html,body{margin:0;background:#f4f2ee;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Мини-просмотрщик GLB для самопроверки модели (WebGL2, без библиотек).
// Параметры в hash: eye=x,y,z&at=x,y,z&fov=50&ortho=0|scale&clip=2.3&hide=Slab,Ceiling&w=1600&h=1000
const P = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(s => s.split('=').map(decodeURIComponent)));
const W = +(P.w || 1600), H = +(P.h || 1000);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const gl = cv.getContext('webgl2', {antialias: true, preserveDrawingBuffer: true});
const V3 = s => s.split(',').map(Number);
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function norm(a){const l=Math.hypot(...a);return a.map(x=>x/l)}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function lookAt(e,t,u){const z=norm(sub(e,t)),x=norm(cross(u,z)),y=cross(z,x);
 return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]}
function persp(f,a,n,fa){const t=1/Math.tan(f*Math.PI/360);return [t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]}
function ortho(s,a,n,fa){return [1/(s*a),0,0,0,0,1/s,0,0,0,0,-2/(fa-n),0,0,0,-(fa+n)/(fa-n),1]}
function mul(a,b){const r=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)r[j*4+i]+=a[k*4+i]*b[j*4+k];return r}
const vs = `#version 300 es
layout(location=0) in vec3 p; layout(location=1) in vec3 n; layout(location=2) in vec2 uv;
uniform mat4 M; out vec3 vp; out vec3 vn; out vec2 vuv;
void main(){vp=p; vn=n; vuv=uv; gl_Position=M*vec4(p,1.);}`;
const fs = `#version 300 es
precision highp float; in vec3 vp; in vec3 vn; in vec2 vuv; out vec4 o;
uniform vec4 base; uniform sampler2D tex; uniform int hasTex; uniform vec3 emis; uniform float clipY; uniform vec3 eye;
uniform float metal; uniform float rough;
void main(){
 if(vp.y>clipY) discard;
 vec4 c = base;
 if(hasTex==1){ vec4 t=texture(tex,vuv); c.rgb*=pow(t.rgb,vec3(2.2)); }
 vec3 N=normalize(vn); vec3 Vd=normalize(eye-vp); if(dot(N,Vd)<0.) N=-N;
 vec3 L1=normalize(vec3(0.45,0.85,0.30)); vec3 L2=normalize(vec3(-0.6,0.5,-0.55));
 float hemi=0.5+0.5*N.y;
 vec3 amb=mix(vec3(0.42,0.40,0.38),vec3(0.78,0.78,0.80),hemi);
 vec3 dif=vec3(1.0,0.96,0.90)*max(dot(N,L1),0.)*0.75+vec3(0.85,0.9,1.0)*max(dot(N,L2),0.)*0.35;
 vec3 col=c.rgb*(amb*0.85+dif);
 vec3 Hh=normalize(L1+Vd); float sp=pow(max(dot(N,Hh),0.),mix(8.,120.,1.-rough))*(1.-rough)*0.35;
 col+=vec3(sp)*mix(vec3(1.),c.rgb,metal);
 if(metal>0.9){ vec3 R=reflect(-Vd,N); col=mix(col, mix(vec3(0.55,0.53,0.5),vec3(0.95),0.5+0.5*R.y), 0.6); }
 col+=emis*1.4;
 col=col/(col+vec3(0.85))*1.75;
 o=vec4(pow(col,vec3(1./2.2)),c.a);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const U=n=>gl.getUniformLocation(pr,n);
async function main(){
 const buf = await (await fetch(P.src || 'model.glb')).arrayBuffer();
 const dv = new DataView(buf); const jl = dv.getUint32(12,true);
 const J = JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl)));
 const binOff = 20+jl+8;
 const view = i => {const v=J.bufferViews[i];return new Uint8Array(buf,binOff+(v.byteOffset||0),v.byteLength)};
 const texs = await Promise.all((J.images||[]).map(async im=>{
   const bmp = await createImageBitmap(new Blob([view(im.bufferView)],{type:im.mimeType}));
   const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bmp); gl.generateMipmap(gl.TEXTURE_2D);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
   const ext=gl.getExtension('EXT_texture_filter_anisotropic'); if(ext) gl.texParameterf(gl.TEXTURE_2D,ext.TEXTURE_MAX_ANISOTROPY_EXT,8);
   return t;}));
 const hide = (P.hide||'').split(',').filter(Boolean);
 const draws=[];
 for(const nd of J.nodes){ if(nd.mesh===undefined) continue;
   if(hide.some(h=>nd.name.includes(h))) continue;
   for(const pm of J.meshes[nd.mesh].primitives){
     const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
     const att=(name,loc,size)=>{ if(pm.attributes[name]===undefined) return; const a=J.accessors[pm.attributes[name]];
       const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,view(a.bufferView),gl.STATIC_DRAW);
       gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);};
     att('POSITION',0,3); att('NORMAL',1,3); att('TEXCOORD_0',2,2);
     const ia=J.accessors[pm.indices]; const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,view(ia.bufferView),gl.STATIC_DRAW);
     const m=J.materials[pm.material]; const pbr=m.pbrMetallicRoughness;
     const cc=(P.clipcls||'').split(',').filter(Boolean);
     const doClip=!cc.length||cc.some(c=>nd.name.startsWith(c+' |'));
     draws.push({vao,n:ia.count,clip:doClip,base:pbr.baseColorFactor,tex:pbr.baseColorTexture?texs[J.textures[pbr.baseColorTexture.index].source]:null,
       emis:m.emissiveFactor||[0,0,0],blend:m.alphaMode==='BLEND',metal:pbr.metallicFactor||0,rough:pbr.roughnessFactor??0.8});
   }}
 const eye=V3(P.eye||'8,12,8'), at=V3(P.at||'3,0,-7');
 const view_=lookAt(eye,at,[0,1,0]);
 const proj=P.ortho&&+P.ortho>0?ortho(+P.ortho,W/H,0.1,100):persp(+(P.fov||55),W/H,0.05,100);
 gl.uniformMatrix4fv(U('M'),false,mul(proj,view_)); gl.uniform3fv(U('eye'),eye); gl.uniform1f(U('clipY'),+(P.clip||99));
 gl.viewport(0,0,W,H); gl.clearColor(0.957,0.949,0.933,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
 gl.uniform1i(U('tex'),0); gl.activeTexture(gl.TEXTURE0);
 const draw=d=>{gl.uniform1f(U('clipY'),d.clip?+(P.clip||99):99.);gl.uniform4fv(U('base'),d.base);gl.uniform3fv(U('emis'),d.emis);gl.uniform1i(U('hasTex'),d.tex?1:0);gl.uniform1f(U('metal'),d.metal);gl.uniform1f(U('rough'),d.rough);
   if(d.tex) gl.bindTexture(gl.TEXTURE_2D,d.tex); gl.bindVertexArray(d.vao); gl.drawElements(gl.TRIANGLES,d.n,gl.UNSIGNED_INT,0);};
 draws.filter(d=>!d.blend).forEach(draw);
 gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
 draws.filter(d=>d.blend).forEach(draw);
 gl.finish(); window.__done=true;
}
main().catch(e=>{document.title='ERR '+e; window.__err=String(e); window.__done=true;});
</script></body></html>
